name: Public safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install exiftool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libimage-exiftool-perl

      - name: Images and identifiers
        run: bash scripts/public-safety.sh

      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
